# PR 검증 — 타입체크 + 테스트.
#
# ★이 워크플로는 머지를 막지 않는다.★ 브랜치 보호의 required check 로 등록하지 않았다.
# 이유: 검사가 상시 빨간불이면 아무도 안 보게 되고, 그러면 진짜 실패도 묻힌다.
# required 로 올리는 것은 초록 이력이 쌓인 뒤 별도 판단으로 한다.
#
# 여기서 돌리는 것은 ★어느 맥에서나 되는 것★ 뿐이다. hermes 게이트웨이·tmux·LaunchAgent·
# 라이브 team.db 처럼 특정 기기 상태에 기대는 검증은 로컬 인수테스트가 맡는다.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # lockfile 을 그대로 쓴다 — CI 가 로컬과 다른 의존성으로 초록이 되면 의미가 없다.
      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: 타입체크
        run: bunx tsc --noEmit

      - name: 테스트
        run: bun test
