name: Portability
on:
  pull_request:
  workflow_dispatch:
jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/check-portability.test.ts
      - run: bun scripts/check-portability.ts
